[package]
name = "filepilot-native"
version = "0.1.0"
edition = "2021"
description = "Быстрое ядро FilePilot: обход папок, извлечение текста, хеширование"
license = "MIT"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true

[dependencies]
blake3 = "1.8.7"
crossbeam-channel = "0.5.17"
encoding_rs = "0.8.44"
globset = "0.4.21"
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py310"] }
quick-xml = "0.42.0"
rayon = "1.12.0"
zip = "9.8.1"
