name: Релиз
# Запускается при создании тега вида v0.3.0 или когда в main меняется номер версии (тег создаётся сам):
# EXE собирается на GitHub, а не на чьём-то компьютере.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["filepilot/__init__.py"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверка версии
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python -c "import filepilot; print(filepilot.__version__)")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test "v$VER" = "${GITHUB_REF_NAME}" || (echo "Тег ${GITHUB_REF_NAME} не совпадает с версией $VER" && exit 1)
          elif gh release view "v$VER" >/dev/null 2>&1; then
            echo "Релиз v$VER уже есть, собирать нечего"
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "TAG=v$VER" >> "$GITHUB_ENV"
      - name: Зависимости
        if: env.SKIP != '1'
        run: python -m pip install -r requirements.txt pyinstaller pytest
      - name: Rust-ядро
        if: env.SKIP != '1'
        run: python scripts/build_native.py
      - name: Тесты
        if: env.SKIP != '1'
        env:
          QT_QPA_PLATFORM: offscreen
          FILEPILOT_REQUIRE_NATIVE: "1"
        run: python -m pytest -q
      - name: Сборка EXE
        if: env.SKIP != '1'
        run: python -m PyInstaller --noconfirm --clean filepilot.spec
      - name: Портативная версия
        if: env.SKIP != '1'
        shell: pwsh
        run: |
          Copy-Item dist\FilePilot dist\FilePilot-Portable -Recurse
          New-Item dist\FilePilot-Portable\portable.flag -ItemType File | Out-Null
          Compress-Archive -Path dist\FilePilot-Portable -DestinationPath dist\FilePilot-Portable.zip
      - name: Установщик
        if: env.SKIP != '1'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = "$env:TAG".TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Постоянное имя для ссылки «Скачать»: releases/latest/download/FilePilotSetup.exe
          Copy-Item "dist\installer\FilePilotSetup-$ver.exe" dist\installer\FilePilotSetup.exe
      - name: Контрольные суммы
        if: env.SKIP != '1'
        shell: pwsh
        run: |
          Get-ChildItem dist\FilePilot-Portable.zip, dist\installer\*.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Out-File dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt
      - name: Описание релиза из CHANGELOG
        if: env.SKIP != '1'
        shell: bash
        run: python scripts/release_notes.py "${TAG}" > dist/notes.md
      - name: Публикация релиза
        if: env.SKIP != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/FilePilot-Portable.zip
            dist/installer/*.exe
            dist/SHA256SUMS.txt
          body_path: dist/notes.md
